<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>价格换算成工作小时数</title><link rel="stylesheet" href="../ui/theme.css"><link rel="stylesheet" href="../ui/pages.css"></head><body>
<p class="eyebrow">理性消费 · 时间账本</p><h1>价格换算成工作小时数</h1>
<section class="panel"><p id="quota" role="status">读取配额…</p><form id="settings">
<label for="currency">时薪币种</label><select id="currency"><option value="USD">USD 美元</option><option value="CNY">CNY 人民币</option><option value="EUR">EUR 欧元</option><option value="GBP">GBP 英镑</option></select>
<label for="wage">每小时收入</label><input id="wage" type="number" min="0.01" step="any" value="25" required>
<label for="daily">每日工作小时</label><input id="daily" type="number" min="0.01" step="any" value="8" required>
<label><input id="cooldown" type="checkbox"> 冲动消费冷静期</label>
<label for="minutes">冷静期分钟数（默认 1440 分钟 / 24 小时）</label><input id="minutes" type="number" min="1" step="1" value="1440" required>
<button type="submit">保存设置</button></form></section>
<button class="primary" id="scan">换算本页</button><p id="status" role="status" aria-live="polite"></p>
<p>每扫描一次页面计 1 次，未找到价格也计入。币种必须与时薪一致，不做汇率换算。</p><button id="options" class="linkish">输入 license / 解锁</button>
<script src="../lib/settings.js"></script><script src="../ui/status.js"></script><script src="popup.js"></script></body></html>
